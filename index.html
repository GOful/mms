<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>맨홀관리지도</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root { --mint:#4CAF50; --bg:#f7f9fb; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: Arial, sans-serif; background: var(--bg); color:#222; }
    header { text-align:center; padding:48px 16px 24px; }
    h1 { margin:0 0 8px; color:var(--mint); font-size: 28px; letter-spacing: .5px; }
    p.sub { margin:0; color:#666; }
    .container { max-width: 820px; margin: 24px auto 64px; padding: 0 16px; }
    .divider { height:2px; background:#e6e8ec; margin:16px 0 24px; }
    .grid {
      display:grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap:12px;
    }
    a.card {
      display:block; text-decoration:none; padding:16px 14px;
      border:1px solid #e5e7eb; border-radius:14px; background:#fff;
      transition: transform .12s ease, box-shadow .12s ease, border-color .12s ease;
      text-align:center; font-weight:600;
    }
    a.card:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(0,0,0,.06); border-color:#d4d8dd; }
    a.card:active { transform: translateY(0); }
    .card span { display:block; color:#111; }
  </style>
</head>
<body>
  <header>
    <h1>맨홀관리지도</h1>
    <p class="sub">지역명을 클릭하면 해당 관리 링크로 이동합니다.</p>
  </header>

  <div class="container">
    <div class="divider"></div>

    <div class="grid">
      <a class="card" href="https://kko.to/0RK2cfzlcR" target="_blank" rel="noopener">
        <span>금락</span>
      </a>
      <a class="card" href="https://kko.to/Ky4QYMPYp1" target="_blank" rel="noopener">
        <span>숙천</span>
      </a>
      <a class="card" href="#" onclick="alert('링크 준비중입니다.'); return false;">
        <span>안심</span>
      </a>
      <a class="card" href="#" onclick="alert('링크 준비중입니다.'); return false;">
        <span>방촌</span>
      </a>
      <a class="card" href="#" onclick="alert('링크 준비중입니다.'); return false;">
        <span>신천</span>
      </a>
      <a class="card" href="#" onclick="alert('링크 준비중입니다.'); return false;">
        <span>반월당</span>
      </a>
      <a class="card" href="#" onclick="alert('링크 준비중입니다.'); return false;">
        <span>성당못</span>
      </a>
      <a class="card" href="#" onclick="alert('링크 준비중입니다.'); return false;">
        <span>월배기지</span>
      </a>
    </div>
  </div>
</body>
</html>
